name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy secrets
        id: gate
        run: echo "ok=${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: Load SSH key
        if: steps.gate.outputs.ok == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy over SSH
        if: steps.gate.outputs.ok == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }}" \
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/deploy.sh | sudo bash"
      - name: Deploy skipped (no VPS secrets)
        if: steps.gate.outputs.ok != 'true'
        run: echo "Set VPS_HOST, VPS_SSH_KEY (and optionally VPS_USER) repo secrets to auto-deploy on push to main."
